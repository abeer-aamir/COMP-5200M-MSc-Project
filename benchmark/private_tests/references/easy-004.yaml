apiVersion: v1
kind: Namespace
metadata:
  name: easy-restart-ns
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: restart-quota
  namespace: easy-restart-ns
spec:
  hard:
    pods: "5"
    services: "2"
    secrets: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: banner-secret
  namespace: easy-restart-ns
immutable: true
type: Opaque
stringData:
  BANNER: hello-restart
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restart-web
  namespace: easy-restart-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restart-web
  template:
    metadata:
      labels:
        app: restart-web
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - "mkdir -p /work && printf 'ready\n' > /work/index.html && httpd -f -p 8080 -h /work"
          env:
            - name: BANNER
              valueFrom:
                secretKeyRef:
                  name: banner-secret
                  key: BANNER
          ports:
            - protocol: TCP
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: restart-svc
  namespace: easy-restart-ns
spec:
  type: ClusterIP
  selector:
    app: restart-web
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
