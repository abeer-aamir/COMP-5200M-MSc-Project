apiVersion: v1
kind: Namespace
metadata:
  name: easy-calc-ns
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: batch-quota
  namespace: easy-calc-ns
spec:
  hard:
    count/jobs.batch: "2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calc-inputs
  namespace: easy-calc-ns
data:
  LEFT: "7"
  RIGHT: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: calc-operation
  namespace: easy-calc-ns
type: Opaque
stringData:
  OPERATION: add
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sum-job
  namespace: easy-calc-ns
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: calculator
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - 'test "$OPERATION" = add && result=$((LEFT + RIGHT)) && echo result=$result && test "$result" -eq 12'
          env:
            - name: LEFT
              valueFrom:
                configMapKeyRef:
                  name: calc-inputs
                  key: LEFT
            - name: RIGHT
              valueFrom:
                configMapKeyRef:
                  name: calc-inputs
                  key: RIGHT
            - name: OPERATION
              valueFrom:
                secretKeyRef:
                  name: calc-operation
                  key: OPERATION
