apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: very-hard-release-ns
- apiVersion: v1
  kind: ConfigMap
  metadata: {name: release-page, namespace: very-hard-release-ns}
  data:
    index.html: "release=v1\n"
- apiVersion: v1
  kind: Secret
  metadata: {name: release-token, namespace: very-hard-release-ns}
  type: Opaque
  immutable: true
  stringData: {TOKEN: release-key}
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata: {name: release-state, namespace: very-hard-release-ns}
  spec:
    accessModes: [ReadWriteOnce]
    resources: {requests: {storage: 64Mi}}
- apiVersion: batch/v1
  kind: Job
  metadata: {name: release-seed, namespace: very-hard-release-ns}
  spec:
    backoffLimit: 0
    activeDeadlineSeconds: 90
    template:
      metadata: {labels: {job-name: release-seed}}
      spec:
        restartPolicy: Never
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        containers:
        - name: seed
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['if [ ! -f /state/schema ]; then printf "schema-1\n" > /state/schema; fi; test "$(cat /state/schema)" = schema-1; echo release-seed-ok']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
          - {name: state, mountPath: /state}
        volumes:
        - name: state
          persistentVolumeClaim: {claimName: release-state}
- apiVersion: apps/v1
  kind: Deployment
  metadata: {name: release-backend, namespace: very-hard-release-ns}
  spec:
    replicas: 2
    selector: {matchLabels: {app: release-backend}}
    template:
      metadata: {labels: {app: release-backend, role: backend}}
      spec:
        automountServiceAccountToken: false
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        initContainers:
        - name: wait-seed
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['i=0; until [ "$(cat /state/schema 2>/dev/null || true)" = schema-1 ]; do i=$((i+1)); [ "$i" -ge 45 ] && exit 1; sleep 2; done']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
          - {name: state, mountPath: /state, readOnly: true}
        containers:
        - name: backend
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['test "$TOKEN" = release-key; test "$(cat /state/schema)" = schema-1; exec httpd -f -p 8080 -h /srv']
          env:
          - name: TOKEN
            valueFrom: {secretKeyRef: {name: release-token, key: TOKEN}}
          ports: [{name: backend-http, containerPort: 8080, protocol: TCP}]
          readinessProbe: {httpGet: {path: /, port: backend-http}, periodSeconds: 5, failureThreshold: 3}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
          - {name: page, mountPath: /srv, readOnly: true}
          - {name: state, mountPath: /state, readOnly: true}
        volumes:
        - name: page
          configMap: {name: release-page}
        - name: state
          persistentVolumeClaim: {claimName: release-state}
- apiVersion: v1
  kind: Service
  metadata: {name: release-backend-svc, namespace: very-hard-release-ns}
  spec:
    type: ClusterIP
    selector: {app: release-backend}
    ports: [{port: 8080, targetPort: backend-http, protocol: TCP}]
- apiVersion: apps/v1
  kind: Deployment
  metadata: {name: release-gateway, namespace: very-hard-release-ns}
  spec:
    replicas: 2
    revisionHistoryLimit: 2
    minReadySeconds: 5
    progressDeadlineSeconds: 150
    strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
    selector: {matchLabels: {app: release-gateway}}
    template:
      metadata: {labels: {app: release-gateway, role: gateway}}
      spec:
        automountServiceAccountToken: false
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        initContainers:
        - name: wait-backend
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['i=0; until [ "$(wget -q -T 5 -O - http://release-backend-svc:8080/)" = release=v1 ]; do i=$((i+1)); [ "$i" -ge 60 ] && exit 1; sleep 2; done']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        containers:
        - name: gateway
          image: busybox:1.36.1
          command: [sh, -ec]
          args:
          - 'while true; do if body=$(wget -q -T 5 -O - http://release-backend-svc:8080/); then printf "%s\n" "$body" > /www/index.new && mv /www/index.new /www/index.html; else rm -f /www/index.html; fi; sleep 2; done & exec httpd -f -p 8081 -h /www'
          ports: [{name: gateway-http, containerPort: 8081, protocol: TCP}]
          readinessProbe: {httpGet: {path: /, port: gateway-http}, periodSeconds: 5, failureThreshold: 2}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: www, mountPath: /www}]
        volumes: [{name: www, emptyDir: {}}]
- apiVersion: v1
  kind: Service
  metadata: {name: release-svc, namespace: very-hard-release-ns}
  spec:
    type: ClusterIP
    selector: {app: release-gateway}
    ports: [{port: 80, targetPort: gateway-http, protocol: TCP}]
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata: {name: release-backend-pdb, namespace: very-hard-release-ns}
  spec: {minAvailable: 1, selector: {matchLabels: {app: release-backend}}}
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata: {name: release-gateway-pdb, namespace: very-hard-release-ns}
  spec: {minAvailable: 1, selector: {matchLabels: {app: release-gateway}}}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: release-default-deny, namespace: very-hard-release-ns}
  spec:
    podSelector: {matchExpressions: [{key: role, operator: In, values: [backend, gateway]}]}
    policyTypes: [Ingress]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: backend-from-gateway, namespace: very-hard-release-ns}
  spec:
    podSelector: {matchLabels: {role: backend}}
    policyTypes: [Ingress]
    ingress: [{from: [{podSelector: {matchLabels: {role: gateway}}}], ports: [{protocol: TCP, port: 8080}]}]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: gateway-from-clients, namespace: very-hard-release-ns}
  spec:
    podSelector: {matchLabels: {role: gateway}}
    policyTypes: [Ingress]
    ingress:
    - from:
      - podSelector: {matchLabels: {access: release}}
      - podSelector: {matchLabels: {role: release-audit}}
      ports: [{protocol: TCP, port: 8081}]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: seed-isolation, namespace: very-hard-release-ns}
  spec: {podSelector: {matchLabels: {job-name: release-seed}}, policyTypes: [Ingress]}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: audit-isolation, namespace: very-hard-release-ns}
  spec: {podSelector: {matchLabels: {role: release-audit}}, policyTypes: [Ingress]}
- apiVersion: v1
  kind: ServiceAccount
  metadata: {name: release-auditor, namespace: very-hard-release-ns}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata: {name: release-page-reader, namespace: very-hard-release-ns}
  rules: [{apiGroups: [''], resources: [configmaps], resourceNames: [release-page], verbs: [get]}]
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata: {name: release-page-reader-binding, namespace: very-hard-release-ns}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release-page-reader}
  subjects: [{kind: ServiceAccount, name: release-auditor, namespace: very-hard-release-ns}]
- apiVersion: batch/v1
  kind: CronJob
  metadata: {name: release-audit, namespace: very-hard-release-ns}
  spec:
    schedule: '*/15 * * * *'
    suspend: true
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    jobTemplate:
      spec:
        activeDeadlineSeconds: 150
        template:
          metadata: {labels: {role: release-audit}}
          spec:
            serviceAccountName: release-auditor
            restartPolicy: Never
            securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
            containers:
            - name: audit
              image: busybox:1.36.1
              command: [sh, -ec]
              args: ['i=0; until [ "$(wget -q -T 5 -O - http://release-svc/)" = release=v1 ]; do i=$((i+1)); [ "$i" -ge 60 ] && exit 1; sleep 2; done; echo release-audit-ok']
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
- apiVersion: v1
  kind: LimitRange
  metadata: {name: release-defaults, namespace: very-hard-release-ns}
  spec:
    limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 32Mi}
      default: {cpu: 200m, memory: 128Mi}
- apiVersion: v1
  kind: ResourceQuota
  metadata: {name: release-quota, namespace: very-hard-release-ns}
  spec:
    hard:
      pods: '12'
      persistentvolumeclaims: '2'
      requests.storage: 256Mi
      services: '4'
      count/jobs.batch: '4'
      count/cronjobs.batch: '2'
      requests.cpu: '2'
      requests.memory: 1Gi
      limits.cpu: '4'
      limits.memory: 2Gi
