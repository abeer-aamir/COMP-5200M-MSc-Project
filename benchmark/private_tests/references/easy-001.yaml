apiVersion: v1
kind: Namespace
metadata:
  name: easy-status-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-web
  namespace: easy-status-ns
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: status-web
  template:
    metadata:
      labels:
        app: status-web
    spec:
      containers:
        - name: web
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - "mkdir -p /www && printf 'status=green\n' > /www/index.html && httpd -f -p 8080 -h /www"
          ports:
            - name: http
              protocol: TCP
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: status-svc
  namespace: easy-status-ns
spec:
  type: ClusterIP
  selector:
    app: status-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: status-ingress
  namespace: easy-status-ns
spec:
  podSelector:
    matchLabels:
      app: status-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: status
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: diagnostics-report
  namespace: easy-status-ns
spec:
  schedule: "0 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: diagnostics
              image: busybox:1.36.1
              command: ["sh", "-c"]
              args: ["echo diagnostics-ready"]
