apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Namespace
  metadata: {name: very-hard-ledger-ns}
- apiVersion: v1
  kind: ConfigMap
  metadata: {name: ledger-prefix, namespace: very-hard-ledger-ns}
  data: {PREFIX: entry}
- apiVersion: v1
  kind: Secret
  metadata: {name: ledger-suffix, namespace: very-hard-ledger-ns}
  type: Opaque
  immutable: true
  stringData: {SUFFIX: stable}
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata: {name: ledger-bootstrap-state, namespace: very-hard-ledger-ns}
  spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 32Mi}}}
- apiVersion: batch/v1
  kind: Job
  metadata: {name: ledger-bootstrap, namespace: very-hard-ledger-ns}
  spec:
    backoffLimit: 0
    activeDeadlineSeconds: 90
    template:
      metadata: {labels: {job-name: ledger-bootstrap}}
      spec:
        restartPolicy: Never
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        containers:
        - name: bootstrap
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['if [ ! -f /bootstrap/epoch ]; then printf "7\n" > /bootstrap/epoch; fi; test "$(cat /bootstrap/epoch)" = 7; echo ledger-bootstrap-ok']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: bootstrap, mountPath: /bootstrap}]
        volumes: [{name: bootstrap, persistentVolumeClaim: {claimName: ledger-bootstrap-state}}]
- apiVersion: v1
  kind: Service
  metadata: {name: ledger-headless, namespace: very-hard-ledger-ns}
  spec:
    clusterIP: None
    publishNotReadyAddresses: false
    selector: {app: ledger}
    ports: [{port: 8080, targetPort: ledger-http, protocol: TCP}]
- apiVersion: v1
  kind: ServiceAccount
  metadata: {name: ledger-inspector, namespace: very-hard-ledger-ns}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata: {name: ledger-status-reader, namespace: very-hard-ledger-ns}
  rules:
  - {apiGroups: [apps], resources: [statefulsets], resourceNames: [ledger], verbs: [get]}
  - {apiGroups: [apps], resources: [statefulsets/status], resourceNames: [ledger], verbs: [get]}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata: {name: ledger-status-reader-binding, namespace: very-hard-ledger-ns}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ledger-status-reader}
  subjects: [{kind: ServiceAccount, name: ledger-inspector, namespace: very-hard-ledger-ns}]
- apiVersion: apps/v1
  kind: StatefulSet
  metadata: {name: ledger, namespace: very-hard-ledger-ns}
  spec:
    serviceName: ledger-headless
    replicas: 3
    podManagementPolicy: OrderedReady
    persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
    updateStrategy: {type: RollingUpdate, rollingUpdate: {partition: 0}}
    selector: {matchLabels: {app: ledger}}
    template:
      metadata: {labels: {app: ledger}}
      spec:
        automountServiceAccountToken: false
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        containers:
        - name: ledger
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['while true; do prefix=$(cat /config/PREFIX); epoch=$(cat /bootstrap/epoch); printf "%s-%s-%s-%s\n" "$prefix" "$HOSTNAME" "$SUFFIX" "$epoch" > /data/index.new; mv /data/index.new /data/index.html; sleep 2; done & exec httpd -f -p 8080 -h /data']
          env:
          - name: SUFFIX
            valueFrom: {secretKeyRef: {name: ledger-suffix, key: SUFFIX}}
          ports: [{name: ledger-http, containerPort: 8080, protocol: TCP}]
          readinessProbe: {httpGet: {path: /, port: ledger-http}, periodSeconds: 5, failureThreshold: 3}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
          - {name: prefix, mountPath: /config, readOnly: true}
          - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
          - {name: data, mountPath: /data}
        volumes:
        - {name: prefix, configMap: {name: ledger-prefix}}
        - {name: bootstrap, persistentVolumeClaim: {claimName: ledger-bootstrap-state}}
    volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 64Mi}}}
- apiVersion: v1
  kind: Service
  metadata: {name: ledger-svc, namespace: very-hard-ledger-ns}
  spec:
    type: ClusterIP
    selector: {app: ledger}
    ports: [{port: 80, targetPort: ledger-http, protocol: TCP}]
- apiVersion: apps/v1
  kind: Deployment
  metadata: {name: ledger-observer, namespace: very-hard-ledger-ns}
  spec:
    replicas: 2
    minReadySeconds: 5
    progressDeadlineSeconds: 180
    strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
    selector: {matchLabels: {app: ledger-observer}}
    template:
      metadata: {labels: {app: ledger-observer}}
      spec:
        serviceAccountName: ledger-inspector
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        containers:
        - name: observer
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['while true; do ok=0; for n in 0 1 2; do wget -q -T 5 -O /dev/null "http://ledger-$n.ledger-headless:8080/" && ok=$((ok+1)); done; if [ "$ok" -eq 3 ]; then printf "ledger-count=3\n" > /www/index.new; mv /www/index.new /www/index.html; else rm -f /www/index.html; fi; sleep 3; done & exec httpd -f -p 8081 -h /www']
          ports: [{name: observer-http, containerPort: 8081, protocol: TCP}]
          readinessProbe: {httpGet: {path: /, port: observer-http}, periodSeconds: 5, failureThreshold: 2}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: www, mountPath: /www}]
        volumes: [{name: www, emptyDir: {}}]
- apiVersion: v1
  kind: Service
  metadata: {name: ledger-observer-svc, namespace: very-hard-ledger-ns}
  spec:
    type: ClusterIP
    selector: {app: ledger-observer}
    ports: [{port: 80, targetPort: observer-http, protocol: TCP}]
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata: {name: ledger-pdb, namespace: very-hard-ledger-ns}
  spec: {minAvailable: 2, selector: {matchLabels: {app: ledger}}}
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata: {name: ledger-observer-pdb, namespace: very-hard-ledger-ns}
  spec: {minAvailable: 1, selector: {matchLabels: {app: ledger-observer}}}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: ledger-default-deny, namespace: very-hard-ledger-ns}
  spec:
    podSelector: {matchExpressions: [{key: app, operator: In, values: [ledger, ledger-observer]}]}
    policyTypes: [Ingress]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: ledger-from-observer, namespace: very-hard-ledger-ns}
  spec:
    podSelector: {matchLabels: {app: ledger}}
    policyTypes: [Ingress]
    ingress:
    - from:
      - podSelector: {matchLabels: {app: ledger-observer}}
      - podSelector: {matchLabels: {access: ledger}}
      ports: [{protocol: TCP, port: 8080}]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: observer-from-client, namespace: very-hard-ledger-ns}
  spec:
    podSelector: {matchLabels: {app: ledger-observer}}
    policyTypes: [Ingress]
    ingress: [{from: [{podSelector: {matchLabels: {access: ledger}}}], ports: [{protocol: TCP, port: 8081}]}]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: bootstrap-isolation, namespace: very-hard-ledger-ns}
  spec: {podSelector: {matchLabels: {job-name: ledger-bootstrap}}, policyTypes: [Ingress]}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: observer-egress, namespace: very-hard-ledger-ns}
  spec:
    podSelector: {matchLabels: {app: ledger-observer}}
    policyTypes: [Egress]
    egress:
    - to: [{podSelector: {matchLabels: {app: ledger}}}]
      ports: [{protocol: TCP, port: 8080}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
- apiVersion: v1
  kind: LimitRange
  metadata: {name: ledger-defaults, namespace: very-hard-ledger-ns}
  spec:
    limits: [{type: Container, defaultRequest: {cpu: 20m, memory: 32Mi}, default: {cpu: 200m, memory: 128Mi}}]
- apiVersion: v1
  kind: ResourceQuota
  metadata: {name: ledger-quota, namespace: very-hard-ledger-ns}
  spec:
    hard:
      pods: '14'
      persistentvolumeclaims: '5'
      requests.storage: 512Mi
      services: '4'
      count/jobs.batch: '3'
      requests.cpu: '2'
      requests.memory: 1Gi
      limits.cpu: '4'
      limits.memory: 2Gi
