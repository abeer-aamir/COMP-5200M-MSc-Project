apiVersion: v1
kind: Namespace
metadata:
  name: service-chain
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-content
  namespace: service-chain
data:
  ready: |
    ready
  value: |
    42
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-content
  namespace: service-chain
data:
  index.html: |
    Gateway online
  health: |
    ok
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  namespace: service-chain
type: Opaque
stringData:
  BACKEND_TOKEN: pilot-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: service-chain
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: service-chain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: service-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        role: backend
    spec:
      serviceAccountName: backend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: backend
          image: busybox:1.36.1
          imagePullPolicy: Never
          command: ["httpd", "-f", "-p", "8081", "-h", "/srv"]
          ports:
            - name: http
              containerPort: 8081
          volumeMounts:
            - name: backend-content
              mountPath: /srv
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 8081
            periodSeconds: 10
      volumes:
        - name: backend-content
          configMap:
            name: backend-content
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: service-chain
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: service-chain
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        role: gateway
    spec:
      serviceAccountName: gateway-sa
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        - name: wait-backend
          image: busybox:1.36.1
          imagePullPolicy: Never
          command:
            - sh
            - -ec
            - |
              for attempt in $(seq 1 30); do
                if response="$(wget -T 2 -O - http://backend-svc:8081/ready)" && [ "$response" = "ready" ]; then
                  exit 0
                fi
                sleep 1
              done
              echo "backend did not become ready after 30 attempts" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gateway
          image: busybox:1.36.1
          imagePullPolicy: Never
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: BACKEND_TOKEN
          volumeMounts:
            - name: gateway-content
              mountPath: /www
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
      volumes:
        - name: gateway-content
          configMap:
            name: gateway-content
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: service-chain
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-apps
  namespace: service-chain
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: [backend, gateway]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-backend
  namespace: service-chain
spec:
  podSelector:
    matchLabels:
      role: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: gateway
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-egress
  namespace: service-chain
spec:
  podSelector:
    matchLabels:
      role: gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: backend
      ports:
        - protocol: TCP
          port: 8081
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-evaluator-ingress
  namespace: service-chain
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: [backend, gateway]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: probe
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: service-chain
spec:
  minAvailable: 1
  selector:
    matchLabels:
      role: gateway
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: service-chain-quota
  namespace: service-chain
spec:
  hard:
    pods: "6"
