apiVersion: v1
kind: Namespace
metadata:
  name: easy-diagnostics-ns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: diagnostics-content
  namespace: easy-diagnostics-ns
data:
  index.html: |
    diagnostics-ready
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostics-web
  namespace: easy-diagnostics-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diagnostics-web
  template:
    metadata:
      labels:
        app: diagnostics-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: busybox:1.36.1
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              protocol: TCP
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /www
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: diagnostics-content
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostics-svc
  namespace: easy-diagnostics-ns
spec:
  type: ClusterIP
  selector:
    app: diagnostics-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: diagnostics-check
  namespace: easy-diagnostics-ns
spec:
  schedule: "*/10 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: busybox:1.36.1
              command: ["sh", "-c"]
              args: ["echo diagnostics-suspended"]
