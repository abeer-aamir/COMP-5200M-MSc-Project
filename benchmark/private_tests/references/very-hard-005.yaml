apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Namespace
  metadata: {name: very-hard-maintenance-ns}
- apiVersion: v1
  kind: ConfigMap
  metadata: {name: archive-prefix, namespace: very-hard-maintenance-ns}
  data: {PREFIX: archive}
- apiVersion: v1
  kind: Secret
  metadata: {name: archive-signing, namespace: very-hard-maintenance-ns}
  type: Opaque
  immutable: true
  stringData: {SIGNING: seal}
- apiVersion: v1
  kind: Service
  metadata: {name: archive-headless, namespace: very-hard-maintenance-ns}
  spec:
    clusterIP: None
    publishNotReadyAddresses: false
    selector: {app: archive}
    ports: [{port: 8080, targetPort: archive-http, protocol: TCP}]
- apiVersion: apps/v1
  kind: StatefulSet
  metadata: {name: archive, namespace: very-hard-maintenance-ns}
  spec:
    serviceName: archive-headless
    replicas: 3
    podManagementPolicy: OrderedReady
    persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
    updateStrategy: {type: RollingUpdate, rollingUpdate: {partition: 0}}
    selector: {matchLabels: {app: archive}}
    template:
      metadata: {labels: {app: archive, component: archive}}
      spec:
        automountServiceAccountToken: false
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        initContainers:
        - name: initialize
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['if [ ! -f /data/generation ]; then printf "g1\n" > /data/generation; fi']
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
        containers:
        - name: archive
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['while true; do prefix=$(cat /config/PREFIX); generation=$(cat /data/generation); printf "%s-%s-%s-%s\n" "$prefix" "$HOSTNAME" "$SIGNING" "$generation" > /data/index.new; mv /data/index.new /data/index.html; sleep 3; done & exec httpd -f -p 8080 -h /data']
          env:
          - name: SIGNING
            valueFrom: {secretKeyRef: {name: archive-signing, key: SIGNING}}
          ports: [{name: archive-http, containerPort: 8080, protocol: TCP}]
          readinessProbe: {httpGet: {path: /, port: archive-http}, periodSeconds: 5, failureThreshold: 3}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
          - {name: prefix, mountPath: /config, readOnly: true}
          - {name: data, mountPath: /data}
        volumes: [{name: prefix, configMap: {name: archive-prefix}}]
    volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 64Mi}}}
- apiVersion: v1
  kind: Service
  metadata: {name: archive-svc, namespace: very-hard-maintenance-ns}
  spec: {type: ClusterIP, selector: {app: archive}, ports: [{port: 80, targetPort: archive-http, protocol: TCP}]}
- apiVersion: apps/v1
  kind: Deployment
  metadata: {name: archive-reader, namespace: very-hard-maintenance-ns}
  spec:
    replicas: 2
    minReadySeconds: 5
    progressDeadlineSeconds: 210
    strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
    selector: {matchLabels: {app: archive-reader}}
    template:
      metadata: {labels: {app: archive-reader, component: reader}}
      spec:
        automountServiceAccountToken: false
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
        containers:
        - name: reader
          image: busybox:1.36.1
          command: [sh, -ec]
          args: ['while true; do prefix=$(cat /config/PREFIX); ok=0; for n in 0 1 2; do body=$(wget -q -T 5 -O - "http://archive-$n.archive-headless:8080/") || body=; [ "$body" = "$prefix-archive-$n-seal-g1" ] && ok=$((ok+1)); done; if [ "$ok" -eq 3 ]; then printf "%s-ready=3\n" "$prefix" > /www/index.new; mv /www/index.new /www/index.html; else rm -f /www/index.html; fi; sleep 3; done & exec httpd -f -p 8081 -h /www']
          ports: [{name: reader-http, containerPort: 8081, protocol: TCP}]
          readinessProbe: {httpGet: {path: /, port: reader-http}, periodSeconds: 5, failureThreshold: 2}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
          - {name: prefix, mountPath: /config, readOnly: true}
          - {name: www, mountPath: /www}
        volumes:
        - {name: prefix, configMap: {name: archive-prefix}}
        - {name: www, emptyDir: {}}
- apiVersion: v1
  kind: Service
  metadata: {name: archive-reader-svc, namespace: very-hard-maintenance-ns}
  spec: {type: ClusterIP, selector: {app: archive-reader}, ports: [{port: 80, targetPort: reader-http, protocol: TCP}]}
- apiVersion: v1
  kind: ServiceAccount
  metadata: {name: archive-maintainer, namespace: very-hard-maintenance-ns}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata: {name: archive-maintenance-reader, namespace: very-hard-maintenance-ns}
  rules:
  - {apiGroups: [apps], resources: [statefulsets], resourceNames: [archive], verbs: [get]}
  - {apiGroups: [''], resources: [configmaps], resourceNames: [archive-prefix], verbs: [get]}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata: {name: archive-maintenance-reader-binding, namespace: very-hard-maintenance-ns}
  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: archive-maintenance-reader}
  subjects: [{kind: ServiceAccount, name: archive-maintainer, namespace: very-hard-maintenance-ns}]
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata: {name: archive-pdb, namespace: very-hard-maintenance-ns}
  spec: {minAvailable: 2, selector: {matchLabels: {app: archive}}}
- apiVersion: policy/v1
  kind: PodDisruptionBudget
  metadata: {name: archive-reader-pdb, namespace: very-hard-maintenance-ns}
  spec: {minAvailable: 1, selector: {matchLabels: {app: archive-reader}}}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: archive-default-deny, namespace: very-hard-maintenance-ns}
  spec:
    podSelector: {matchExpressions: [{key: component, operator: In, values: [archive, reader]}]}
    policyTypes: [Ingress, Egress]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: archive-ingress, namespace: very-hard-maintenance-ns}
  spec:
    podSelector: {matchLabels: {component: archive}}
    policyTypes: [Ingress]
    ingress:
    - from:
      - podSelector: {matchLabels: {component: reader}}
      - podSelector: {matchLabels: {role: archive-maintenance}}
      - podSelector: {matchLabels: {access: archive}}
      ports: [{protocol: TCP, port: 8080}]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: reader-ingress, namespace: very-hard-maintenance-ns}
  spec:
    podSelector: {matchLabels: {component: reader}}
    policyTypes: [Ingress]
    ingress:
    - from: [{podSelector: {matchLabels: {role: archive-maintenance}}}, {podSelector: {matchLabels: {access: archive}}}]
      ports: [{protocol: TCP, port: 8081}]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: maintenance-isolation, namespace: very-hard-maintenance-ns}
  spec: {podSelector: {matchLabels: {role: archive-maintenance}}, policyTypes: [Ingress]}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: reader-egress, namespace: very-hard-maintenance-ns}
  spec:
    podSelector: {matchLabels: {component: reader}}
    policyTypes: [Egress]
    egress:
    - to: [{podSelector: {matchLabels: {component: archive}}}]
      ports: [{protocol: TCP, port: 8080}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata: {name: maintenance-egress, namespace: very-hard-maintenance-ns}
  spec:
    podSelector: {matchLabels: {role: archive-maintenance}}
    policyTypes: [Egress]
    egress:
    - to: [{podSelector: {matchLabels: {component: reader}}}]
      ports: [{protocol: TCP, port: 8081}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
- apiVersion: batch/v1
  kind: CronJob
  metadata: {name: archive-compact, namespace: very-hard-maintenance-ns}
  spec:
    schedule: '13 */2 * * *'
    suspend: true
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    jobTemplate:
      spec:
        activeDeadlineSeconds: 210
        template:
          metadata: {labels: {role: archive-maintenance}}
          spec:
            serviceAccountName: archive-maintainer
            restartPolicy: Never
            securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
            containers:
            - name: compact
              image: busybox:1.36.1
              command: [sh, -ec]
              args: ['i=0; until [ "$(wget -q -T 5 -O - http://archive-reader-svc/)" = archive-ready=3 ]; do i=$((i+1)); [ "$i" -ge 90 ] && exit 1; sleep 2; done; printf "compacted\n" > /data/compacted; echo archive-compact-ok']
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              volumeMounts: [{name: data, mountPath: /data}]
            volumes: [{name: data, persistentVolumeClaim: {claimName: data-archive-0}}]
- apiVersion: v1
  kind: LimitRange
  metadata: {name: archive-defaults, namespace: very-hard-maintenance-ns}
  spec: {limits: [{type: Container, defaultRequest: {cpu: 20m, memory: 32Mi}, default: {cpu: 200m, memory: 128Mi}}]}
- apiVersion: v1
  kind: ResourceQuota
  metadata: {name: archive-quota, namespace: very-hard-maintenance-ns}
  spec:
    hard:
      pods: '14'
      persistentvolumeclaims: '4'
      requests.storage: 384Mi
      services: '4'
      count/jobs.batch: '3'
      count/cronjobs.batch: '2'
      requests.cpu: '2'
      requests.memory: 1Gi
      limits.cpu: '4'
      limits.memory: 2Gi
